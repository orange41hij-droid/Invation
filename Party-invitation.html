<!-- 2. The JavaScript logic (placed below the div so the div loads first) -->
<script>
  // Grab the HTML element by its ID
  const timerDisplay = document.getElementById("timer");

  // Set your target end date and time (Format: "Month Day, Year HH:MM:SS")
  const endTime = new Date("June 12, 2027 17:00:00").getTime();

  function updateClock() {
    // Get the current time in milliseconds
    const now = new Date().getTime();

    // Find the remaining time in milliseconds
    const distance = endTime - now;

    // Stop the timer if the end time has passed
    if (distance <= 0) {
      clearInterval(timerLoop);
      timerDisplay.textContent = "00:00:00:00";
      return;
    }

    // Math to convert milliseconds into days, hours, minutes, and seconds
    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    // Add a leading zero if a number is less than 10 (e.g., "5" becomes "05")
    const formattedDays = String(days).padStart(2, "0");
    const formattedHours = String(hours).padStart(2, "0");
    const formattedMinutes = String(minutes).padStart(2, "0");
    const formattedSeconds = String(seconds).padStart(2, "0");

    // Push the formatted clock string into your HTML div
    timerDisplay.textContent = `${formattedDays}:${formattedHours}:${formattedMinutes}:${formattedSeconds}`;
  }

  // Run the function every 1000 milliseconds (1 second)
  const timerLoop = setInterval(updateClock, 1000);

  // Run it once immediately so there isn't a 1-second blank delay on page load
  updateClock();
</script>
